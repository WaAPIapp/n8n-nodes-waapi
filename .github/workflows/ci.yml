name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    name: node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - run: npm run build

      # `tsc` is incremental, and a build that emits nothing still exits 0. The
      # entry points n8n loads are therefore checked for existence rather than
      # inferred from the build succeeding -- a silent empty dist has happened
      # here once already.
      - name: Check the entry points n8n loads exist
        run: |
          node -e '
            const pkg = require("./package.json");
            const fs = require("fs");
            const missing = [...pkg.n8n.nodes, ...pkg.n8n.credentials].filter((p) => !fs.existsSync(p));
            if (missing.length) { console.error("Missing:", missing); process.exit(1); }
            console.log("All entry points present.");
          '

      # The node is loaded by whatever n8n-workflow the host n8n ships, not by
      # the one in devDependencies. A value imported from it that only exists in
      # recent versions therefore breaks loading on older installations, with
      # n8n reporting nothing more useful than "The specified package could not
      # be loaded" -- which is exactly what reached a user in 1.7.3.
      - name: Load the built node against an old n8n-workflow
        run: |
          npm install --no-save --force n8n-workflow@1.48.0
          node -e '
            const m = require("./dist/nodes/WaAPI/Waapi.node.js");
            const d = new m.WaAPI().description;
            if (!Array.isArray(d.inputs) || d.inputs[0] !== "main") {
              throw new Error("inputs is " + JSON.stringify(d.inputs));
            }
            if (!Array.isArray(d.properties) || d.properties.length < 400) {
              throw new Error("properties: " + (d.properties || []).length);
            }
            console.log("Loads on n8n-workflow 1.48.0 with", d.properties.length, "properties.");
          '

      - run: npm test

  # Separate from the matrix on purpose: eslint-plugin-n8n-nodes-base and
  # jsonc-eslint-parser require Node 20 or newer, and ESLint crashes loading the
  # config below that. That is a constraint on the tooling, not on the published
  # package -- which is a class and a JSON file and runs wherever n8n does -- so
  # it does not belong in the matrix that states what the package supports.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - run: npm run lint
