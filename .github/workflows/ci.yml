name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The development toolchain needs Node 22: n8n-workflow 2.x pulls in
  # isolated-vm, a native module that only builds on Node >= 22, so `npm ci`
  # fails on anything older. Building, testing and linting therefore run on 22.
  # What the published package supports is checked separately, on the built
  # output, in the `load` job below.
  check:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Check n8n can load the build with the current n8n-workflow
        run: node scripts/check-load.js

      # Before anything replaces n8n-workflow: ts-jest compiles the sources
      # against the installed typings, and the old version lacks
      # NodeConnectionTypes and usableAsTool.
      - run: npm test

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # The package is a class and a JSON file. It declares Node >= 18.10 and runs
  # inside whatever n8n the user hosts, with that n8n's n8n-workflow. This job
  # loads exactly the built output on each Node version, against an old
  # n8n-workflow, without installing the development dependencies.
  load:
    name: load on node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install the old n8n-workflow outside the project
        run: npm install --prefix "$RUNNER_TEMP/host" --no-save --no-package-lock n8n-workflow@1.48.0

      - name: Load the built node against n8n-workflow 1.48.0
        run: NODE_PATH="$RUNNER_TEMP/host/node_modules" node scripts/check-load.js

  # eslint-plugin-n8n-nodes-base needs Node >= 20.15, and `npm ci` needs 22 for
  # the reason above.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - run: npm run lint
