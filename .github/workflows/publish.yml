name: publish

# npm requires a provenance statement on packages submitted for community node
# verification, and it can only be produced by a CI run it can attest to -- a
# publish from a laptop cannot carry one. This also takes the release off a
# single person's authenticator.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The version published is whatever package.json holds, so it is checked
      # against the tag rather than assumed: a release tagged v1.7.1 built from
      # a package.json still saying 1.7.0 would publish the wrong thing, or
      # silently fail as a duplicate.
      - name: Check the version matches the tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          [ "$tag" = "$pkg" ]

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
