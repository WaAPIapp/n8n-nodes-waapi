name: publish

# Publishes through npm trusted publishing: GitHub Actions proves its identity
# to npm over OIDC, so no token is stored anywhere and there is no secret to
# leak or rotate. npm generates the provenance attestation itself, which is what
# community node verification requires and what a publish from a laptop cannot
# produce.
#
# The trust is pinned on npmjs.com to this repository AND this filename. Renaming
# this file breaks publishing until the package settings are updated to match.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the runner mint the OIDC token npm verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1. Node 22
      # ships an older npm, so it is upgraded explicitly rather than assumed.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `tsc` is incremental and a build that emits nothing still exits 0, so
      # the files n8n loads are checked for existence rather than inferred.
      - name: Check the entry points n8n loads exist
        run: |
          node -e '
            const pkg = require("./package.json");
            const fs = require("fs");
            const missing = [...pkg.n8n.nodes, ...pkg.n8n.credentials].filter((p) => !fs.existsSync(p));
            if (missing.length) { console.error("Missing:", missing); process.exit(1); }
            console.log("All entry points present.");
          '

      - name: Test
        run: npm test

      # A release tagged v1.8.0 built from a package.json still saying 1.7.0
      # would publish the wrong version, or fail as a duplicate.
      - name: Check the version matches the tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          [ "$tag" = "$pkg" ]

      # No NODE_AUTH_TOKEN: the OIDC token above is the credential, and npm
      # attaches provenance on its own for a public package from a public repo.
      - name: Publish
        run: npm publish --access public
